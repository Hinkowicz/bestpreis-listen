name: Wöchentliche Bestpreis-Listen

on:
  schedule:
    - cron: "17 5 * * 1"   # jeden Montag ca. 07:17 Uhr (deutsche Zeit): neue Wochen-Listen
    - cron: "7 23 * * *"   # täglich kurz nach Mitternacht: neue Tages-Deals, abgelaufene Links ausblenden
    - cron: "37 */3 * * *" # alle 3 Stunden: Amazon-Deals (und alle Preise) aktualisieren
  workflow_dispatch:        # manuell starten über "Run workflow"
  push:                     # z. B. Link-Änderungen über /admin/ – nach ~1–2 Minuten live
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Der 3-Stunden-Takt läuft nur während einer Amazon-Aktion (Zeitraum in content/amazon.json)
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ "${{ github.event.schedule }}" != "37 */3 * * *" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 -c 'from gh.events import load_event; print("run=" + str(load_event()["active"]).lower())' >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests (Affiliate-Links, Anzeige-Hinweis, Budgets)
        run: python -m unittest discover -s tests -t .
      - name: Listen berechnen
        env:
          GEIZHALS_USER: ${{ vars.GEIZHALS_USER || 'hinkowicz' }}
          GEIZHALS_SECRET: ${{ secrets.GEIZHALS_SECRET }}
          WEEKLY_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 1' }}
        run: python run.py --out site
      - name: Vorwochen-Daten speichern
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 1')
        run: |
          git config user.name "bestpreis-bot"
          git config user.email "bestpreis-bot@users.noreply.github.com"
          git add data/history.json data/debug.json 2>/dev/null || git add data/debug.json
          git diff --cached --quiet || git commit -m "Wöchentliches Update $(date +%F)"
          git pull -q --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
