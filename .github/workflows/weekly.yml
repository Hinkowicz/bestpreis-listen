name: Wöchentliche Bestpreis-Listen

on:
  schedule:
    - cron: "17 5 * * 1"   # jeden Montag ca. 07:17 Uhr (deutsche Zeit)
  workflow_dispatch:        # manuell starten über "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Listen berechnen
        env:
          GEIZHALS_USER: ${{ vars.GEIZHALS_USER || 'hinkowicz' }}
          GEIZHALS_SECRET: ${{ secrets.GEIZHALS_SECRET }}
        run: python run.py --out site
      - name: Vorwochen-Daten speichern
        run: |
          git config user.name "bestpreis-bot"
          git config user.email "bestpreis-bot@users.noreply.github.com"
          git add data/history.json data/debug.json
          git diff --cached --quiet || git commit -m "Wöchentliches Update $(date +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
